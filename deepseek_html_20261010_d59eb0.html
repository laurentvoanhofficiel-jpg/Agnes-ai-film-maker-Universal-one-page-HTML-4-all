<script>
/* ═════════════════════════════════════════════════════════════════════
   CONFIG
   ═════════════════════════════════════════════════════════════════════ */
const API='https://apihub.agnes-ai.com/v1',POLL='https://apihub.agnes-ai.com/agnesapi';
const TXT=['agnes-3.0-flash','agnes-2.5-flash'],IMG='agnes-image-2.5-flash',VID={free:'agnes-video-v2.0',plan:'agnes-video-2.5-flash'};
const RPM={free:{img:10,vid:1,txt:10},plan:{img:100,vid:5,txt:600}};
const STEPS=['Clés','Genre','Synopsis','Personnages','Scènes','Plans','Vidéos'];
const BACK=[3,6,12,24,48,96];
const G=[['Fiction',[
  "Court-métrage d'auteur|contemplative arthouse short film, natural light, 35mm grain",
  "Drame|naturalistic drama, muted palette, intimate framing",
  "Comédie|bright warm comedy, lively colors, wide lenses",
  "Thriller|tense thriller, low-key lighting, cold teal tones",
  "Horreur|atmospheric horror, deep shadows, desaturated",
  "Science-fiction|visionary sci-fi, vast futuristic scale, clean cold light",
  "Fantasy|epic fantasy, painterly landscapes, golden hour",
  "Western|dusty western, anamorphic wide, sun-baked tones",
  "Film noir|black and white film noir, hard shadows, rain",
  "Romance|soft romantic cinema, warm bokeh, pastel light",
  "Aventure|adventure blockbuster, dynamic wide shots, saturated",
  "Action|kinetic action, high contrast, motion energy",
  "Guerre|gritty war film, desaturated, handheld",
  "Historique|period drama, authentic costumes, candlelight",
  "Policier|crime investigation, neon night city, moody",
  "Cyberpunk|cyberpunk neon rain, dense city, magenta and cyan",
  "Post-apocalyptique|post-apocalyptic wasteland, rusted ruins, dusty light",
  "Conte merveilleux|fairy tale storybook cinema, magical glow"
]],['Réel',[
  "Documentaire|observational documentary, natural light, real locations",
  "Docu-fiction|docu-fiction hybrid, handheld, authentic",
  "Biopic|biographical drama, period accurate, intimate close-ups",
  "Reportage|journalistic report, handheld, available light",
  "Film nature|nature documentary, telephoto wildlife, majestic landscapes",
  "Film d'archives|archival footage look, grainy, faded colors"
]],['Animation',[
  "Animation 2D|hand-drawn 2D animation, flat colors, ink outlines",
  "Anime|japanese anime cinematic, detailed backgrounds, dramatic lighting",
  "Stop-motion|stop-motion puppets, handmade textures, tabletop sets",
  "Dessin animé enfants|colorful kids cartoon, rounded shapes, cheerful",
  "Style Moebius|Moebius ligne claire comic art, pastel desert colors, flat non-3D drawing"
]],['Expérimental',[
  "Poème visuel|poetic visual essay, abstract imagery, slow",
  "Film contemplatif|slow cinema, long takes, static framing",
  "Film muet|silent film look, expressive acting, grain",
  "Vidéo-art|video art, surreal, bold color fields",
  "Plan-séquence|single continuous take, tracking camera, seamless"
]],['Formats courts',[

  "Clip musical|music video, stylized, rhythmic visuals",
  "Teaser|teaser, mysterious, minimal reveals"
]]];

/* ═════════════════════════════════════════════════════════════════════
   UTILS
   ═════════════════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const san=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”«»]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...').replace(/[\u00a0\u202f]/g,' ');

/* ═════════════════════════════════════════════════════════════════════
   STATE
   ═════════════════════════════════════════════════════════════════════ */
let db,P=null,Q=null,page=0,F=1,playing=false,TASK=null;
const KEYS={list:[],plan:'free'};
const AR=()=>(P?P.ratio:'16:9').replace(':','/');
const ref=i=>i&&(i.d||i.u);
const mkKey=k=>({k,img:0,vid:0,txt:0,cool:0,bad:0,off:false});

/* ═════════════════════════════════════════════════════════════════════
   STOCKAGE
   ═════════════════════════════════════════════════════════════════════ */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('cinegenesis_v1',1);r.onerror=()=>rej(r.error);r.onsuccess=()=>res(r.result);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('sessions'))d.createObjectStore('sessions',{keyPath:'id'});if(!d.objectStoreNames.contains('config'))d.createObjectStore('config',{keyPath:'key'})}})}
const tx=(s,m,f)=>new Promise((res,rej)=>{try{const r=f(db.transaction(s,m).objectStore(s));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
let mode='idb';const mem={sessions:{},config:{}},lsK=(s,k)=>'cg1_'+s+'_'+k;
function fall(e){if(mode=='idb'){mode='ls';log('wr','IndexedDB indisponible ('+(e&&e.message)+') → stockage de secours');toast('Stockage navigateur limité : sauvegarde de secours activée')}}
async function dbGet(s,k){if(db&&mode=='idb'){try{return await tx(s,'readonly',o=>o.get(k))}catch(e){fall(e)}}try{const v=localStorage.getItem(lsK(s,k));if(v!=null)return JSON.parse(v)}catch(e){}return mem[s][k]}
async function dbPut(s,v){const k=v.key||v.id;mem[s][k]=v;if(db&&mode=='idb'){try{return await tx(s,'readwrite',o=>o.put(v))}catch(e){fall(e)}}try{localStorage.setItem(lsK(s,k),JSON.stringify(v))}catch(e){}}
async function dbDel(s,k){delete mem[s][k];if(db&&mode=='idb'){try{return await tx(s,'readwrite',o=>o.delete(k))}catch(e){fall(e)}}try{localStorage.removeItem(lsK(s,k))}catch(e){}}
async function dbAll(s){if(db&&mode=='idb'){try{return await tx(s,'readonly',o=>o.getAll())}catch(e){fall(e)}}const o=Object.assign({},mem[s]);try{for(let i=0;i<localStorage.length;i++){const n=localStorage.key(i);if(n.startsWith(lsK(s,''))){const v=JSON.parse(localStorage.getItem(n));o[v.key||v.id]=v}}}catch(e){}return Object.values(o)}
let svT;function save(){if(!P)return;clearTimeout(svT);svT=setTimeout(()=>{P.upd=Date.now();dbPut('sessions',P).catch(e=>log('er','sauvegarde : '+e.message))},350)}

/* ═════════════════════════════════════════════════════════════════════
   LOG / TOAST
   ═════════════════════════════════════════════════════════════════════ */
function log(l,m){const d=document.createElement('div');d.className='lg '+l;d.textContent=new Date().toLocaleTimeString('fr-FR')+'  '+m;const b=$('#lb');if(!b)return;b.appendChild(d);while(b.children.length>400)b.firstChild.remove();b.scrollTop=b.scrollHeight}
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),4200)}

/* ═════════════════════════════════════════════════════════════════════
   PLANIFICATEUR MULTI-CLÉS
   ═════════════════════════════════════════════════════════════════════ */
async function slot(kind){
  for(;;){
    if(TASK&&TASK.stop)throw new Error('stop');
    const live=KEYS.list.filter(o=>!o.off);
    if(!live.length)throw Object.assign(new Error('Aucune clé active'),{fatal:true});
    const iv=60000/RPM[KEYS.plan][kind]*1.15*F,now=Date.now();
    let best=null,bt=1e18;
    for(const o of live){
      const t=Math.max(o[kind]||0,o.cool||0,now);
      if(t<bt){bt=t;best=o}
    }
    if(bt>now){
      await sleep(Math.min(bt-now,400));
      continue;
    }
    if(best.cool>Date.now())continue;
    best[kind]=now+iv;
    return best;
  }
}
async function call(kind,url,body,tries){
  let err;
  for(let a=0;a<tries;a++){
    const o=await slot(kind);
    try{
      const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+o.k},body:JSON.stringify(body)});
      if(r.ok){o.bad=0;F=Math.max(1,F*0.97);return r}
      const t=(await r.text()).slice(0,200);log('er',kind+' HTTP '+r.status+' '+t);
      if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||25)*1000;F=Math.min(4,F*1.5);err=new Error('429');continue}
      if(r.status==401||r.status==402||r.status==403){if(++o.bad>=2){o.off=true;log('wr','clé …'+o.k.slice(-4)+' désactivée')}err=new Error('HTTP '+r.status);continue}
      if(r.status>=500||r.status==408){err=new Error('HTTP '+r.status);await sleep(2000*Math.pow(2,a));continue}
      throw Object.assign(new Error('HTTP '+r.status+' '+t),{fatal:true});
    }catch(e){
      if(e.fatal||e.message=='stop')throw e;
      err=e;
      await sleep(1500*(a+1));
    }
  }
  throw err||new Error('échec');
}

/* ═════════════════════════════════════════════════════════════════════
   JSON PARSER
   ═════════════════════════════════════════════════════════════════════ */
function J(t){
  if(!t)return null;
  let c=String(t).replace(/```json|```/g,'');
  const a=c.indexOf('{'),b=c.lastIndexOf('}');
  if(a<0||b<0)return null;
  c=c.slice(a,b+1);
  try{return JSON.parse(c)}catch(e){}
  let o='',s=false,x=false;
  for(let i=0;i<c.length;i++){
    const ch=c[i];
    if(x){o+=ch;x=false;continue}
    if(ch=='\\'){o+=ch;x=true;continue}
    if(ch=='"'){s=!s;o+=ch;continue}
    if(s&&ch=='\n'){o+='\\n';continue}
    if(s&&ch=='\r'){continue}
    if(s&&ch.charCodeAt(0)<32){o+=' ';continue}
    o+=ch;
  }
  try{return JSON.parse(o.replace(/,\s*([}\]])/g,'$1'))}catch(e){return null}
}

/* ═════════════════════════════════════════════════════════════════════
   IA — CHAT / JSON
   ═════════════════════════════════════════════════════════════════════ */
async function chat(sys,user,max,temp,imgs){
  for(let i=0;i<TXT.length;i++){
    const m=TXT[i];
    try{
      const c=imgs&&imgs.length?[{type:'text',text:user}].concat(imgs.map(u=>({type:'image_url',image_url:{url:u}}))):user;
      const r=await call('txt',API+'/chat/completions',{model:m,messages:[{role:'system',content:sys},{role:'user',content:c}],temperature:temp,max_tokens:max,chat_template_kwargs:{enable_thinking:false}},3);
      const d=await r.json();
      const t=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(t)return t;
    }catch(e){
      if(e.fatal||e.message=='stop')throw e;
      log('wr','texte '+m+' : '+e.message);
    }
  }
  throw new Error('IA texte indisponible');
}
async function llmJSON(sys,user,max,temp,imgs){
  for(let a=0;a<2;a++){
    const j=J(await chat(sys+' Réponds UNIQUEMENT par un objet JSON valide, sans texte autour.',user,max,temp,imgs));
    if(j)return j;
  }
  throw new Error('Réponse IA illisible (JSON)');
}

/* ═════════════════════════════════════════════════════════════════════
   IMAGES — CONVERSION ASYNCHRONE NON BLOQUANTE
   ═════════════════════════════════════════════════════════════════════ */
/* Convertit une URL en data URI. Ne bloque PAS le pipeline : utilisé
   uniquement en arrière-plan ou quand une référence est nécessaire. */
function toData(u){
  return new Promise(resolve=>{
    if(!u)return resolve(null);
    if(u.indexOf('data:')===0)return resolve(u);
    fetch(u).then(r=>r.blob()).then(b=>{
      const o=URL.createObjectURL(b),im=new Image();
      im.onload=()=>{
        try{
          const s=Math.min(1,1024/Math.max(im.width,im.height));
          const c=document.createElement('canvas');
          c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
          c.getContext('2d').drawImage(im,0,0,c.width,c.height);
          URL.revokeObjectURL(o);
          resolve(c.toDataURL('image/jpeg',0.86));
        }catch(e){URL.revokeObjectURL(o);resolve(null)}
      };
      im.onerror=()=>{URL.revokeObjectURL(o);resolve(null)};
      im.src=o;
    }).catch(()=>resolve(null));
  });
}
/* Lance la génération d'image et retourne immédiatement l'URL.
   La conversion en data URI se fait en arrière-plan (utilisée plus tard
   seulement si l'image sert de référence à une autre génération). */
function mkImg(prompt,refUris,ratio){
  const body={model:IMG,prompt:san(prompt),n:1,size:'1K',ratio:ratio||P.ratio,extra_body:{response_format:'url'}};
  if(refUris&&refUris.length)body.extra_body.image=refUris.filter(Boolean).slice(0,4);
  return call('img',API+'/images/generations',body,3).then(r=>r.json()).then(d=>{
    const it=d.data&&d.data[0];
    const u=it&&(it.url||(it.b64_json&&'data:image/png;base64,'+it.b64_json));
    if(!u)throw new Error('pas d\'image reçue');
    const img={u:u,d:u.indexOf('data:')===0?u:null};
    if(!img.d){
      // Conversion en arrière-plan : ne bloque pas le pipeline
      img._conv=toData(u).then(dd=>{img.d=dd||u;return img.d}).catch(()=>{img.d=u;return img.d});
    }
    return img;
  });
}
/* Retourne une promesse vers le data URI de l'image (conversion à la demande) */
function ensureRef(img){
  if(!img)return Promise.resolve(null);
  if(img.d)return Promise.resolve(img.d);
  if(img._conv)return img._conv;
  img._conv=toData(img.u).then(dd=>{img.d=dd||img.u;return img.d}).catch(()=>{img.d=img.u;return img.d});
  return img._conv;
}
function readFile(f,maxSide){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const s=Math.min(1,maxSide/Math.max(im.width,im.height));
        const c=document.createElement('canvas');
        c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        const d=c.toDataURL('image/jpeg',0.88);
        res({u:d,d:d});
      };
      im.onerror=()=>res(null);
      im.src=fr.result;
    };
    fr.readAsDataURL(f);
  });
}

};
const anyBusy=()=>allObjs().some(o=>o.busy);
function find(id){
  if(id=='P')return{t:'p',o:P};
  for(let i=0;i<P.chars.length;i++)if(P.chars[i].id==id)return{t:'c',o:P.chars[i]};
  for(let i=0;i<P.scenes.length;i++){
    const s=P.scenes[i];
    if(s.id==id)return{t:'s',o:s};
    const sh=s.shots||[];
    for(let j=0;j<sh.length;j++)if(sh[j].id==id)return{t:'h',o:sh[j],s:s};

const st=()=>P.genre?P.genre.style:'cinematic';

function promptFor(f){
  const o=f.o;
  if(f.t=='c'){
    return {
      p:'Full-body character reference, plain neutral background, '+st()+'. '+o.name+': '+o.desc+'. '+(o.outfit?'Wearing: '+o.outfit+'.':'')+' No text, no watermark.',
      refs:[],
      ratio:'9:16'
    };
  }
  if(f.t=='s'){
    const sh=sheet(o.chars);
    return {
      p:'Cinematic establishing frame. '+st()+'. Setting: '+o.decor+'. Mood: '+o.mood+'. '+(sh?'Characters present (identical to references): '+sh+'.':'')+' No text, no watermark.',
      refs:cImgs(o.chars)
    };
  }
  // shot
  const sh=sheet(o.chars);

  };
}

/* ═════════════════════════════════════════════════════════════════════
   GÉNÉRATION D'IMAGE
   ═════════════════════════════════════════════════════════════════════ */
async function gen(id,opt){
  opt=opt||{};
  const f=find(id);
  if(!f||f.o.busy)return;
  const o=f.o;
  o.busy=true;o.err='';refresh(id);
  try{
    const q=promptFor(f);
    let p=q.p;
    let refObjs=q.refs.filter(Boolean);
    if(opt.edit&&o.img){
      refObjs=[o.img].concat(refObjs);
      p+=' Edit the first reference image: '+opt.extra+'. Keep everything else identical.';
    }else if(opt.extra){
      p+=' '+opt.extra+'.';
    }
    // Convertit les références en data URI (déjà en cache si déjà générées)
    const refUris=[];
    for(let i=0;i<refObjs.length;i++){
      const uri=await ensureRef(refObjs[i]);
      if(uri)refUris.push(uri);
    }
    o.img=await mkImg(p,refUris,q.ratio);
  }catch(e){
    if(e.message!='stop'){
      o.err='Échec : '+String(e.message).slice(0,80);
      log('er','image : '+e.message);
    }
  }
  o.busy=false;refresh(id);save();
}
async function imgPass(list,label){
  const todo=list.filter(o=>!o.img);
  if(!todo.length)return;
  setTiles(list);
  const it=fd('Création des '+label+' (0/'+todo.length+')');
  setPg(0,todo.length);
  let n=0;
  await Promise.all(todo.map(async o=>{
    await gen(o.id);
    n++;
    setPg(n,todo.length);
    it.t='Création des '+label+' ('+n+'/'+todo.length+')';
    paintFeed();
  }));
  chk();
  const miss=list.filter(o=>!o.img);
  if(miss.length){
    it.t='Nouvel essai pour '+miss.length+' image(s)…';
    paintFeed();
    await Promise.all(miss.map(o=>gen(o.id)));
    chk();
  }
  fdDone(it,list.filter(o=>o.img).length+'/'+list.length+' '+label+' prêt(e)s');
}

function fd(t){const it={t:t,s:'run',at:Date.now()};TASK.items.push(it);paintFeed();return it}

function paintFeed(){const e=$('#feed');if(!e||!TASK)return;const n=Date.now();e.innerHTML=TASK.items.map(i=>'<div class="fi '+i.s+'"><span class="ic">'+(i.s=='ok'?'✓':i.s=='er'?'✕':'<i class="sp2"></i>')+'</span><span>'+esc(i.t)+'</span>'+(i.s=='run'?'<em>'+Math.round((n-i.at)/1000)+' s</em>':'')+'</div>').join('')}
function setPg(d,t){if(!TASK)return;TASK.pg=[d,t];pgb()}

function setTiles(l){TASK.tiles=l;const e=$('#tiles');if(e)e.innerHTML=l.map(mini).join('')}
const chk=()=>{if(TASK&&TASK.stop)throw new Error('stop')};

    (T.err?'':'<div class="ft"><span></span>'+btn('stoptask','■ Arrêter')+'</div>')+'</div>';

async function task(step,title,fn,after){
  if(TASK)return;
  TASK={step:step,title:title,fn:fn,after:after,items:[],start:Date.now(),stop:false,err:null,pg:null,tiles:null};
  page=step;
  render();
  try{
    await fn();
    chk();
  }catch(e){
    const T=TASK;
    if(e.message=='stop'){
      TASK=null;
      toast('Arrêté');
      render();
      return;
    }
    T.items.forEach(i=>{if(i.s=='run')i.s='er'});
    T.err=e.message;
    log('er',title+' : '+e.message);
    render();
    paintFeed();
    return;
  }
  TASK=null;
  after();
}
function retryTask(){const T=TASK;if(!T||!T.err)return;TASK=null;task(T.step,T.title,T.fn,T.after)}
setInterval(()=>{if(!TASK||TASK.err)return;const e=$('#el');if(e)e.textContent=Math.round((Date.now()-TASK.start)/1000)+' s';paintFeed()},1000);

async function aiShots(s){
  const j=await llmJSON('Réalisateur et chef opérateur.',
    CTX()+'\nScène : '+s.title+'. '+s.summary+'\nDécor : '+s.decor+'. Ambiance : '+s.mood+'.\nPersonnages : '+(s.chars||[]).join(', ')+'\nDialogues :\n'+s.dialogue+'\nDécoupe en 3 à 5 plans de 8 à 10 secondes. Répartis les répliques dans les plans. {"shots":[{"size":"wide|medium|close-up|over-the-shoulder","camera":"English camera movement","action":"English visual description, 1-2 sentences","chars":["noms"],"who":"","line":"réplique en français ou vide"}]}',
    3500,0.7);
  const a=j.shots||[];
  if(!a.length)throw new Error('aucun plan reçu');
  s.shots=a.map(h=>({id:uid(),size:String(h.size||'medium'),camera:String(h.camera||'static'),action:String(h.action||''),chars:Array.isArray(h.chars)?h.chars.map(String):[],who:String(h.who||''),line:String(h.line||''),img:null,busy:false,vst:'wait'}));
}
async function aiDescribe(c){
  const j=await llmJSON('Directeur de casting.','Décris cette personne. {"desc":"precise English physical description: age, face, hair, skin, build","outfit":"precise English clothing with colors"}',500,0.2,[ref(c.img)]);
  c.desc=String(j.desc||c.desc);
  c.outfit=String(j.outfit||c.outfit);
}

function runSyn(){
  task(2,'Analyse de votre synopsis',async()=>{
    const a=fd('Lecture de votre idée et du genre choisi');fdDone(a);
    const b=fd('L\'IA réécrit votre synopsis et imagine 10 propositions plus puissantes…');
    await aiSyn();
    chk();
    fdDone(b,'Synopsis réécrit + 10 propositions prêtes');
  },()=>done(2,'pick'));
}
function runMerge(){
  task(2,'Fusion de vos choix',async()=>{
    const a=fd('L\'IA fusionne '+P.syn.sel.length+' suggestion(s) avec votre synopsis…');
    await aiMerge();
    chk();
    fdDone(a,'Synopsis final écrit');
  },()=>done(2,'fin'));
}
function runChars(m){
  let ai=(m=='ai');
  task(3,'Création des personnages',async()=>{
    if(ai){
      const a=fd('L\'IA lit votre synopsis et imagine les personnages…');
      await aiChars();
      ai=false;chk();
      fdDone(a,P.chars.length+' personnages imaginés : '+P.chars.map(c=>c.name).join(', '));
    }
    for(const c of P.chars.filter(c=>c.img&&!c.desc)){
      const d=fd('Analyse de la photo de '+c.name+'…');
      try{await aiDescribe(c)}catch(e){if(e.message=='stop')throw e}
      fdDone(d,'Photo de '+c.name+' analysée');
    }
    await imgPass(P.chars,'portraits');
  },()=>done(3,'rev'));
}
function runScenes(n){
  let w=true;
  task(4,'Écriture du scénario',async()=>{
    if(w){
      const a=fd('L\'IA écrit le scénario : '+n+' scènes, avec décors, ambiances et dialogues…');
      await aiScenes(n);
      w=false;chk();
      fdDone(a,P.scenes.length+' scènes écrites');
    }
    await imgPass(P.scenes,'images de scènes');
  },()=>done(4,'rev'));
}
function runShots(){
  task(5,'Découpage en plans et images',async()=>{
    const todo=P.scenes.filter(s=>!(s.shots||[]).length);
    if(todo.length){
      const a=fd('Découpage de '+todo.length+' scène(s) en plans…');
      let k=0;
      const cut=async s=>{
        try{await aiShots(s)}catch(e){if(e.message=='stop')throw e;log('wr',s.title+' : '+e.message)}
        k++;
        a.t='Découpage des scènes ('+k+'/'+todo.length+')…';
        paintFeed();
      };
      await Promise.all(todo.map(cut));
      chk();
      for(const s of P.scenes.filter(s=>!(s.shots||[]).length))await cut(s);
      fdDone(a,'Scènes découpées en '+shots().length+' plans');
    }
    if(!shots().length)throw new Error('Aucun plan créé');
    await imgPass(shots().map(x=>x.h),'images de plans');
  },()=>done(5,'rev'));
}

async function launch(h,s){
  const o=await slot('vid'),free=KEYS.plan=='free';
  const fr=h.img.u&&h.img.u.indexOf('data:')!==0?h.img.u:ref(h.img);
  const D=dims();
  const body=free
    ?{model:VID.free,prompt:vp(h,s),num_frames:97,frame_rate:12,width:D[0],height:D[1],image:fr}
    :{model:VID.plan,prompt:vp(h,s),seconds:'10',mode:'keyframe',size:'720P',aspect_ratio:P.ratio,first_frame:fr};
  h.vst='run';h.msg='envoi…';h.err='';refresh(h.id);
  let r;
  try{r=await fetch(API+'/videos',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+o.k},body:JSON.stringify(body)})}
  catch(e){h.vst='wait';Q.next=Date.now()+30000;log('wr','réseau : '+e.message);refresh(h.id);return}
  if(r.status==503){const t=await r.text().catch(()=>'');log('wr','503 '+t.slice(0,120));h.vst='wait';refresh(h.id);return sat()}
  if(r.status==429){o.cool=Date.now()+(parseInt(r.headers.get('Retry-After'))||30)*1000;h.vst='wait';refresh(h.id);return}
  if(!r.ok){
    const t=(await r.text().catch(()=>'')).slice(0,140);
    if([401,402,403].indexOf(r.status)>=0&&++o.bad>=2){
      o.off=true;
      if(!KEYS.list.some(k=>!k.off)){Q.on=false;Q.st='paused';toast('Aucune clé active')}
    }
    h.vst='er';h.err='HTTP '+r.status+' '+t;log('er','vidéo '+h.err);refresh(h.id);return;
  }
  const d=await r.json();
  const id=d.video_id||d.id||d.task_id||(d.data&&(d.data.video_id||d.data.id));
  if(!id){h.vst='er';h.err='pas de video_id';refresh(h.id);return}
  let inner=null;
  try{
    if(id.indexOf('video_')===0){
      let b=id.slice(6);
      while(b.length%4)b+='=';
      const m=atob(b).match(/video_id:([^;]+)/);
      if(m)inner=m[1].trim();
    }
  }catch(e){}
  h.task={id:id,inner:inner,k:o.k};
  Q.st='run';Q.step=0;
  log('ok','vidéo envoyée (clé …'+o.k.slice(-4)+')');
  save();qui();
  poll(h);
}
async function poll(h){
  const t=h.task,model=VID[KEYS.plan],end=Date.now()+30*60000;
  let n=0,miss=0;const key=t.k;
  try{
    await sleep(KEYS.plan=='free'?30000:8000);
    while(Date.now()<end&&P){
      const ids=[t.id];
      if(t.inner&&t.inner!=t.id)ids.push(t.inner);
      const iv=Math.min(20000,6000+n*1500);n++;
      let d=null;
      for(let i=0;i<ids.length;i++){
        try{
          const r=await fetch(POLL+'?video_id='+encodeURIComponent(ids[i])+'&model_name='+encodeURIComponent(model),{headers:{Authorization:'Bearer '+key}});
          if(r.status==429){await sleep(8000);continue}
          if(!r.ok){miss++;continue}
          d=await r.json();
          break;
        }catch(e){miss++}
      }
      if(d){
        const s=String(d.status||d.state||'').toLowerCase();
        h.msg=d.progress?d.progress+'%':s;
        refresh(h.id);
        if(['completed','succeeded','done','success','finished','ready'].indexOf(s)>=0){
          const u=(d.metadata&&(d.metadata.url||d.metadata.video_url))||(d.output&&(d.output.url||d.output.video_url))||(d.data&&(d.data.url||d.data.video_url))||d.url||d.video_url;
          if(!u)throw new Error('terminé sans URL');
          h.video=u;h.vst='ok';h.seen=false;h.err='';
          log('ok','vidéo prête');toast('🎬 Nouvelle vidéo prête');
          save();refresh(h.id);
          return;
        }
        if(['failed','error','cancelled','canceled','rejected'].indexOf(s)>=0){
          throw new Error(String((d.error&&d.error.message)||d.error||'échec génération').slice(0,100));
        }
      }else if(miss>20)throw new Error('suivi impossible');
      await sleep(iv);
    }
    throw new Error('délai dépassé');
  }catch(e){
    h.vst='er';h.err=e.message;
    log('er','vidéo : '+e.message);
    save();refresh(h.id);
  }
}
setInterval(function(){
  qui();
  if(!P||!Q.on||Q.busy||Date.now()<Q.next)return;
  const a=shots(),todo=a.filter(x=>x.h.vst=='wait'&&x.h.img),run=a.filter(x=>x.h.vst=='run').length,live=KEYS.list.filter(k=>!k.off).length;
  if(!todo.length){if(!run){Q.on=false;Q.st='idle';save();qui()}return}
  if(run>=Math.max(2,live*3))return;
  Q.busy=true;
  const next=todo[0];
  launch(next.h,next.s).catch(e=>{log('er','file : '+e.message);Q.on=false;Q.st='paused'}).then(()=>{Q.busy=false});
},1000);
let wl=null;
async function wake(){try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}}
function qstart(){
  if(!shots().some(x=>x.h.img))return toast('Il faut d\'abord des images de plans');
  Q.on=true;
  if(Q.st=='paused'||Q.st=='idle')Q.st='run';
  if(Q.st!='full')Q.next=0;
  wake();save();qui();
  log('in','production vidéo lancée');
}

/* ═════════════════════════════════════════════════════════════════════
   LECTEUR
   ═════════════════════════════════════════════════════════════════════ */
function speak(t){
  if(!t||!('speechSynthesis' in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang='fr-FR';
  speechSynthesis.speak(u);
}
async function play(){
  const a=shots().filter(x=>x.h.video||x.h.img);
  if(!a.length)return toast('Rien à lire pour l\'instant');
  playing=true;
  $('#pl').classList.add('on');
  const v=$('#pv'),im=$('#pi');
  for(let i=0;i<a.length;i++){
    if(!playing)break;
    const h=a[i].h;
    $('#sub').textContent=h.line?(h.who?h.who+' : ':'')+h.line:'';
    if(h.video){
      im.style.display='none';v.style.display='block';
      v.src=h.video;
      await new Promise(r=>{v.onended=r;v.onerror=r;v.play().catch(r)});
      h.seen=true;
    }else{
      v.style.display='none';im.style.display='block';
      im.src=ref(h.img);
      speak(h.line);
      await sleep(Math.max(3500,(h.line||'').length*75));
    }
  }
  stopPlay();save();
}
function stopPlay(){
  playing=false;
  $('#pv').pause();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  $('#pl').classList.remove('on');
  if(page==6&&!TASK)render(true);
}

/* ═════════════════════════════════════════════════════════════════════
   ACTIONS
   ═════════════════════════════════════════════════════════════════════ */
const OK_DURING=['con','stoptask','retrytask','canceltask','closemd'];
function redo(n){
  if(!confirm('Refaire cette étape avec l\'IA ? Le contenu actuel de l\'étape sera remplacé.'))return;
  if(n==3)P.chars=[];
  if(n==4)P.scenes=[];
  if(n==5)P.scenes.forEach(s=>s.shots=[]);
  P.sub[n]='cfg';
  render();
  if(n==5)runShots();
  else onEnter();
}
async function onClick(e){
  const b=e.target.closest('[data-a]');
  if(!b||b.disabled)return;
  const a=b.dataset.a,id=b.dataset.id;
  if(TASK&&OK_DURING.indexOf(a)<0)return toast('Une opération est en cours : patientez ou cliquez sur Arrêter');
  if(a=='go')go(+b.dataset.n);
  else if(a=='con')$('#con').classList.toggle('on');
  else if(a=='closemd')$('#md').classList.remove('on');
  else if(a=='savekeys'){
    const ks=Array.from(new Set($('#keys').value.split(/[\s,;]+/).map(s=>s.trim()).filter(s=>s.length>=8)));
    if(!ks.length)return toast('Collez au moins une clé API (une par ligne)');
    KEYS.plan=$('#plan').value;
    KEYS.list=ks.map(k=>{
      const old=KEYS.list.find(o=>o.k==k);
      return old||mkKey(k);
    });
    dbPut('config',{key:'keys',list:ks,plan:KEYS.plan}).catch(er=>log('wr','clés : '+er.message));
    toast('✓ '+ks.length+' clé(s) enregistrée(s)');
    go(Math.max(1,P.last||1));
  }
  else if(a=='genre'){P.genre={name:b.dataset.n,style:b.dataset.s};render(true)}
  else if(a=='ratio'){P.ratio=b.dataset.n;render(true)}
  else if(a=='synai'){if((P.synRaw||'').trim().length<10)return toast('Écrivez au moins une phrase');runSyn()}
  else if(a=='synasis'){if((P.synRaw||'').trim().length<10)return toast('Écrivez au moins une phrase');P.final=P.synRaw;P.syn=null;done(2,'fin')}
  else if(a=='synedit'){P.syn=null;P.final='';P.sub[2]='in';render()}
  else if(a=='synback'){P.sub[2]=P.syn?'pick':'in';render()}
  else if(a=='synok'){
    if((P.syn.sel||[]).length)runMerge();
    else{P.final=P.syn.base;P.sub[2]='fin';render()}
  }
  else if(a=='chai')runChars('ai');
  else if(a=='chown')runChars('own');
  else if(a=='addchar'){P.chars.push({id:uid(),name:'Nouveau personnage',role:'',desc:'',outfit:'',img:null,busy:false});render(true);scrollTo(0,document.body.scrollHeight)}
  else if(a=='nsc'){P.nsc=+b.dataset.n;render(true)}
  else if(a=='scgo'){if(P.scenes.length&&!confirm('Remplacer les scènes existantes ?'))return;runScenes(P.nsc||5)}
  else if(a=='plgo')runShots();
  else if(a=='addscene'){P.scenes.push({id:uid(),title:'Nouvelle scène',summary:'',decor:'',mood:'',chars:[],dialogue:'',img:null,busy:false,shots:[]});render(true)}
  else if(a=='addshot'){const f=find(id);if(f){const s=f.o;(s.shots=s.shots||[]).push({id:uid(),size:'medium',camera:'static',action:'',chars:[],who:'',line:'',img:null,busy:false,vst:'wait'});render(true)}}
  else if(a=='redo')redo(+b.dataset.n);
  else if(a=='gen'){const i=document.querySelector('[data-mod="'+id+'"]');gen(id,{extra:i&&i.value.trim()})}
  else if(a=='mod'){
    const i=document.querySelector('[data-mod="'+id+'"]');
    if(i&&i.value.trim())gen(id,{edit:true,extra:i.value.trim()});
    else{toast('Écrivez d\'abord ce que vous voulez changer');if(i)i.focus()}
  }
  else if(a=='del'){
    if(!confirm('Supprimer ?'))return;
    const f=find(id);
    if(!f)return;
    if(f.t=='c')P.chars=P.chars.filter(c=>c.id!=id);
    else if(f.t=='s')P.scenes=P.scenes.filter(s=>s.id!=id);
    else f.s.shots=f.s.shots.filter(h=>h.id!=id);
    render(true);
  }
  else if(a=='stoptask'){TASK.stop=true;toast('Arrêt en cours…')}
  else if(a=='retrytask')retryTask();
  else if(a=='canceltask'){TASK=null;render()}
  else if(a=='qstart')qstart();
  else if(a=='qpause'){Q.on=false;Q.st='paused';save();qui()}
  else if(a=='qnow'){Q.on=true;Q.next=0;log('in','test manuel de la file vidéo');save()}
  else if(a=='retry'){const f=find(id);f.o.vst='wait';f.o.err='';Q.on=true;if(Q.st=='paused'||Q.st=='idle')Q.st='run';refresh(id);qui()}
  else if(a=='play')play();
  else if(a=='stopplay')stopPlay();
  else if(a=='export'){
    const u=URL.createObjectURL(new Blob([JSON.stringify(P)],{type:'application/json'}));
    const l=document.createElement('a');
    l.href=u;l.download=(P.title||'film')+'.json';l.click();
  }
  else if(a=='sess')sessions();
  else if(a=='new'){setP(newP());$('#md').classList.remove('on');page=KEYS.list.length?1:0;render()}
  else if(a=='open'){
    const p=await dbGet('sessions',id);
    if(p){setP(p);page=KEYS.list.length?Math.max(1,Math.min(p.page||1,6)):0;$('#md').classList.remove('on');render();resume()}
  }
  else if(a=='delsess'){
    if(!confirm('Supprimer cette session ?'))return;
    await dbDel('sessions',id);
    if(P.id==id){setP(newP());page=KEYS.list.length?1:0;render()}
    sessions();
  }
}
document.addEventListener('click',e=>{onClick(e).catch(er=>{log('er','action : '+er.message);toast('Erreur : '+er.message)})});
window.addEventListener('error',e=>{log('er',e.message);toast('Erreur : '+e.message)});
window.addEventListener('unhandledrejection',e=>{log('er','promesse : '+(e.reason&&e.reason.message||e.reason))});
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.dataset.f||!P)return;
  const o=t.dataset.id=='P'?P:(find(t.dataset.id)||{}).o;
  if(!o)return;
  if(t.dataset.arr){
    o[t.dataset.f]=t.value.split(',').map(s=>s.trim()).filter(Boolean);
  }else{
    o[t.dataset.f]=t.value;
  }
  save();
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.sg!==undefined){
    const i=+t.dataset.sg,s=P.syn.sel=P.syn.sel||[];
    if(t.checked){if(s.indexOf(i)<0)s.push(i)}
    else P.syn.sel=s.filter(x=>x!=i);
    save();
  } else if(t.dataset.up){
    const f=t.files[0];
    if(!f)return;
    const o=find(t.dataset.up);
    if(!o)return;
    const im=await readFile(f,1024);
    if(!im)return toast('Image illisible');
    o.o.img=im;o.o.err='';
    if(o.t=='c'){
      o.o.busy=true;refresh(o.o.id);
      try{await aiDescribe(o.o);toast('Photo analysée : fiche du personnage remplie')}
      catch(er){log('wr','analyse photo : '+er.message)}
      o.o.busy=false;
    }
    refresh(o.o.id);save();
  }
});
document.addEventListener('play',e=>{
  const v=e.target;
  if(v.dataset&&v.dataset.id){
    const f=find(v.dataset.id);
    if(f&&!f.o.seen){
      f.o.seen=true;
      const n=v.parentNode.querySelector('.nw');
      if(n)n.remove();
      save();stats();
    }
  }
},true);
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&playing)stopPlay()});
async function sessions(){
  const l=(await dbAll('sessions')).sort((a,b)=>b.upd-a.upd);
  $('#mdc').innerHTML='<h3>Mes films</h3><p class="sub">Tout est enregistré automatiquement dans ce navigateur : textes, images, vidéos générées.</p><div class="rw">'+btn('new','+ Nouveau film','big')+btn('closemd','Fermer')+'</div>'+
    l.map(p=>{
      const sh=p.scenes.flatMap(s=>s.shots||[]);
      const nv=sh.filter(h=>h.video&&!h.seen).length;
      return '<div class="cd" style="margin-top:8px"><b>'+esc(p.title||(p.genre&&p.genre.name)||'Sans titre')+'</b>'+(p.id==P.id?' · <span class="lab">en cours</span>':'')+
        '<div class="lab">'+new Date(p.upd).toLocaleString('fr-FR')+' · '+p.scenes.length+' scènes · '+sh.filter(h=>h.img).length+' images · '+sh.filter(h=>h.video).length+' vidéos'+(nv?' · '+nv+' non vues':'')+'</div>'+
        '<div class="rw">'+btn('open','Ouvrir','sm','data-id="'+p.id+'"')+btn('delsess','Supprimer','sm','data-id="'+p.id+'"')+'</div></div>';
    }).join('');
  $('#md').classList.add('on');
}
$('#md').addEventListener('click',e=>{if(e.target.id=='md')e.target.classList.remove('on')});

/* ═════════════════════════════════════════════════════════════════════
   REPRISE + INIT
   ═════════════════════════════════════════════════════════════════════ */
function resume(){
  shots().forEach(x=>{
    if(x.h.vst=='run'&&x.h.task){
      if(KEYS.list.some(k=>k.k==x.h.task.k))poll(x.h);
      else x.h.vst='wait';
    }
  });
  qui();
}
(async()=>{
  try{db=await Promise.race([openDB(),new Promise((_,rj)=>setTimeout(()=>rj(new Error('délai dépassé')),3000))])}
  catch(e){db=null;fall(e)}
  try{
    const k=await dbGet('config','keys');
    if(k){KEYS.plan=k.plan||'free';KEYS.list=(k.list||[]).map(mkKey)}
    const last=await dbGet('config','last'),p=last&&await dbGet('sessions',last.v);
    setP(p||newP());
  }catch(e){setP(newP())}
  page=KEYS.list.length?Math.max(1,Math.min(P.page||1,6)):0;
  render();
  resume();
  log('in','CINÉ-GENESIS prêt · '+KEYS.list.length+' clé(s)');
  if(KEYS.list.length)onEnter();
})();
</script></body></html>
